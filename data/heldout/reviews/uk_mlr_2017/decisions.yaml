    guideline_quote: 'identify_ubo: inquire about, identify or verify the beneficial owners of a customer, including the information
      to obtain about them and understanding the customer''s ownership and control structure.'
    reason: When all means of identifying the beneficial owner are exhausted (28(7)), the firm must verify the identity of
      the senior managing person, the beneficial owner of last resort whom 28(6) lets it treat as the BO. This is a 'must'
      duty within the BO process rather than the deeming permission itself, and the connected-party carve-out applies only
      to verify_customer; the records part of (b) does not remove the type.
  - adjudicator: 2
    model: fable
    types:
    - identify_ubo
    decided_by_guideline: false
    pre_registered_breaks_guideline: false
    guideline_quote: inquire about, identify or verify the beneficial owners of a customer
    reason: '28(8)(b) is the mandatory last step of the beneficial-owner identification scheme in 28(4)-(8): when no beneficial
      owner can be found, the firm must verify the senior managing person, the person 28(6) lets it treat as the beneficial
      owner. That is verification of the beneficial owner of last resort, so identify_ubo is the better reading; the connected-party
      exclusion is written only into verify_customer, and the guideline leaves this open.'
  - adjudicator: 3
    model: sonnet
    types:
    - identify_ubo
    decided_by_guideline: false
    pre_registered_breaks_guideline: false
    guideline_quote: inquire about, identify or verify the beneficial owners of a customer, including the information to obtain
      about them and understanding the customer's ownership and control structure.
    reason: 28(8)(b) is a 'must' duty to verify the identity of the senior person who, by 28(6), takes the place of the beneficial
      owner when no beneficial owner can be identified; this is the last step of beneficial-owner identification. The deeming
      exclusion applies to 28(6) itself (a 'may treat' provision), not to this separate duty, and verify_customer's connected-party
      carve-out does not limit identify_ubo. The record-keeping parts add nothing. Reading the person as a non-owner is arguable.
