guideline_questions:
- question: "'Connected parties' is used in the verify_customer exclusion but not defined; for the UK text, should it be stated that a body-corporate customer's directors and senior managers (28(3)(b)(ii)) are connected parties, and does the same exclusion apply to identify_ubo when the senior managing person is verified as the beneficial owner of last resort (28(8)(b))?"
- question: "verify_customer lists 'the sources to use' and 'when verification must be completed'; identify_ubo lists neither. Should rules on the sources for beneficial-owner verification (28(9)) and on when beneficial-owner verification must be completed (30ZA(3)(a), 30(2)) be identify_ubo?"
- question: "How should 'must' paragraphs that a permission is expressly 'subject to' (30ZA(2) and (3) under 30ZA(1)) be treated: as obligations in their own right, or as exception conditions like the 'provided that' provisos of 30(3)-(4) and 31(5)?"
- question: "Is a factor list that elaborates when CDD on existing customers is 'appropriate' (27(9)) a cdd_triggers requirement, risk assessment, or a paragraph that only says how 27(8)(a) is read? Three reviewers read it as a trigger on the strength of its content."
- question: "When one item of a list that carries a type falls into an excluded kind (35(3)(a) risk assessment, 35(5)(c) ongoing monitoring, 28(8)(a) record keeping), does the item lose the list's type? The labels do this inconsistently (35(3)(a) dropped, 35(5)(c) kept)."
- question: "Does prohibit_anonymous cover the 'keep' half as implemented by transitional clauses that require CDD on existing anonymous accounts before use (29(7), 29(7A)), and does 'accounts' extend to safe-deposit boxes and to bearer share certificates (29(8))?"
- question: "Is a separately numbered paragraph that lists the information to obtain for a labelled duty (30A(1A) for 30A(1)/(2A)) part of that requirement, or a definition excluded under 'Definitions'?"
- question: "Are clauses that say on whom CDD must be applied (27(7B)) outside verify_customer as well as outside cdd_triggers? The guideline only excludes 'on whom' from triggers."
- question: "Does a threshold carve-back from an exemption (38(2): the e-money exemption does not apply to cash redemptions over £50) count as 'a transaction above a threshold' trigger, or as a scope statement on the exemption?"
