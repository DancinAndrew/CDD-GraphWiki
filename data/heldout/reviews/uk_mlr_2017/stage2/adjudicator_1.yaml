- candidate: K016
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_2
  types:
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'Permissions and exemptions ("may", "shall not be required to", "in lieu of"), including the
    exception conditions attached to a requirement. They relax an obligation rather than impose one. / verify_customer:
    identify the customer or verify the customer''s identity, including the information to obtain, the sources to
    use and when verification must be completed.'
  reason: Although 30ZA(1) is made 'subject to' it, 30ZA(2) is itself a 'must' duty to identify the customer before
    the account is opened; it imposes rather than relaxes an obligation, unlike 'if'/'provided that' exception conditions
    such as 30(3)(a)-(b) or 31(5)(a), so it carries verify_customer through item (a).
- candidate: K017
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_2_a
  types:
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'verify_customer: identify the customer or verify the customer''s identity, including the information
    to obtain, the sources to use and when verification must be completed.'
  reason: '''Identify the customer in accordance with regulation 28(2)(a)'' before the account is opened is a customer-identification
    requirement with a timing condition; the exception-condition reading is possible, but the item imposes a duty
    rather than relaxing one.'
- candidate: K018
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_3
  types:
  - cdd_incomplete
  - identify_ubo
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: A lead-in gets type T when its own text states a requirement of type T, or introduces a list
    whose items have type T.
  reason: 'The lead-in states no trigger of its own: ''after permitting ... under paragraph (1)'' refers back to
    the deferral, not to a new event that makes CDD due (the duty arises from establishing the relationship). It
    takes the types of its items: (a) completion timing for the remaining customer and beneficial-owner verification,
    and (b) no further transactions until CDD is complete.'
- candidate: K019
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_3_a
  types:
  - identify_ubo
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'verify_customer: identify the customer or verify the customer''s identity, including the information
    to obtain, the sources to use and when verification must be completed. / Saying *how* CDD is done, or *on whom*,
    is not a trigger.'
  reason: The insolvent bank customer's CDD is triggered by establishing the relationship; 30ZA(1) only defers it,
    and (a) sets the deadline ('as soon as practicable') for the remaining regulation 28 measures, chiefly verifying
    the customer (28(2)(b)) and its beneficial owners (28(4)). That is 'when verification must be completed', not
    a new trigger; cdd_triggers holds only if opening the account under 30ZA(1) is treated as a trigger event.
- candidate: K020
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_3_b
  types:
  - cdd_incomplete
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'cdd_incomplete: not start or continue a relationship, transaction or transfer because the required
    customer due diligence (identification and verification) could not be completed. / Permissions and exemptions
    ("may", "shall not be required to", "in lieu of"), including the exception conditions attached to a requirement.
    They relax an obligation rather than impose one.'
  reason: Once a regulation 33(1) situation is apparent the bank must carry out no further transactions until CDD
    is complete, i.e. not continue transactions because CDD is incomplete. It is a 'must' duty, not an 'if'/'provided
    that' condition like the 30(4) proviso, so the exception-condition exclusion does not clearly reach it.
