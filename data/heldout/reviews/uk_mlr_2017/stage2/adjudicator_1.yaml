guideline_questions:
- question: Do 'must take into account, among other things' factor lists that say when CDD on existing customers
    is appropriate (27(9)), or how the extent of EDD is assessed (35(4)), count as cdd_triggers / pep_edd, or as
    paragraphs that only say how another paragraph is applied? 28(13), 33(6) and 37(3) have the same form.
- question: Does 'Definitions ... and paragraphs that only say how other paragraphs are read' cover a separate paragraph
    that defines, by cross-reference, the list of beneficial-ownership information another paragraph requires the
    firm to collect (30A(1A))? The sub-paragraph example ('an item in the list of information the bank shall obtain
    about a beneficial owner') pulls the other way.
- question: Are negative compliance statements ('do not satisfy their requirements under paragraph (4) by relying
    solely on ...', 28(9)) interpretation like the 'is to be treated as identifying' deeming provisions, or source
    requirements? verify_customer names 'the sources to use' but identify_ubo does not; is that intentional?
- question: Does 'exception conditions attached to a requirement' cover mandatory 'must' duties that a permission
    is made 'subject to' (30ZA(2) and (3)), and should the 'no transactions before verification' proviso of 30(4)
    then be treated the same as 30ZA(3)(b)?
- question: Does prohibit_anonymous ('not open or keep anonymous accounts') cover the transitional duty to apply
    CDD to pre-existing anonymous accounts before use (29(7), 29(7A)), and does it extend beyond accounts to safe-deposit
    boxes, bearer shares (29(8)) or anonymous prepaid cards (38(4A))?
- question: When generic 'apply the other customer due diligence measures ... as soon as practicable' wording sets
    the completion deadline for deferred CDD (30ZA(3)(a)), is it verify_customer/identify_ubo (completion timing)
    or cdd_triggers? identify_ubo does not mention timing the way verify_customer does.
- question: Does the MAS term 'connected parties' in the verify_customer carve-out apply to UK clauses that require
    identifying a body corporate's directors and senior managers (28(3)(b)(ii)), and is verifying the senior managing
    person when no beneficial owner is found (28(8)(b)) identify_ubo?
- question: 'For PEP provisions: are PEP-prompted assessments (35(3)(a) risk level, 35(3)(b) extent of EDD) pep_edd
    or excluded risk assessment, and is ''risk-management systems and procedures ... to manage the enhanced risks''
    (35(1)) an excluded internal policy or a pep_edd measure?'
