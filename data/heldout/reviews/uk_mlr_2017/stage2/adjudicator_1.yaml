- candidate: K007
  clause_id: uk_mlr_2017_27_cdd_27_9_d
  types: []
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'Requirements of other kinds that the system does not model: risk assessment, screening, ongoing
    monitoring, record keeping, reliance on third parties, correspondent banking, wire-transfer message content,
    suspicious transaction reporting, simplified CDD, internal policies, and enhanced measures for higher-risk customers
    who are not politically exposed persons (PEPs).'
  reason: '''Any other matter which might affect the ... assessment of the money laundering or terrorist financing
    risk'' names no event and is a risk-assessment input, so it is the weakest trigger candidate in the list; its
    status still follows the reading of the 27(9) lead-in.'
- candidate: K008
  clause_id: uk_mlr_2017_28_cdd_measures_28_3_b_ii
  types: []
  decided_by_guideline: true
  pre_registered_breaks_guideline: true
  guideline_quote: It does not cover persons acting on the customer's behalf, connected parties or life-policy beneficiaries.
  reason: The clause requires the firm to determine and verify the names of the directors and senior managers of
    a body-corporate customer, i.e. to identify its connected parties (the guideline's MAS term for directors and
    persons with executive authority), not the customer itself; verify_customer expressly excludes connected parties,
    unlike the customer's own attributes in 28(3)(a) and (b)(i).
- candidate: K009
  clause_id: uk_mlr_2017_28_cdd_measures_28_8
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: A lead-in gets type T when its own text states a requirement of type T, or introduces a list
    whose items have type T.
  reason: The lead-in introduces (a), record keeping (excluded), and (b), verifying the senior managing person when
    no beneficial owner can be found, which I read as identify_ubo; it carries identify_ubo through (b) and would
    lose it only if (b) did.
- candidate: K010
  clause_id: uk_mlr_2017_28_cdd_measures_28_8_b
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'identify_ubo: inquire about, identify or verify the beneficial owners of a customer, including
    the information to obtain about them and understanding the customer''s ownership and control structure.'
  reason: When all means of identifying the beneficial owner are exhausted (28(7)), the firm must verify the identity
    of the senior managing person, the beneficial owner of last resort whom 28(6) lets it treat as the BO. This
    is a 'must' duty within the BO process rather than the deeming permission itself, and the connected-party carve-out
    applies only to verify_customer; the records part of (b) does not remove the type.
- candidate: K011
  clause_id: uk_mlr_2017_28_cdd_measures_28_9
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'identify_ubo: inquire about, identify or verify the beneficial owners of a customer, including
    the information to obtain about them and understanding the customer''s ownership and control structure. / Definitions,
    scope statements and paragraphs that only say how other paragraphs are read.'
  reason: In substance 28(9) bars the firm from meeting its 28(4) beneficial-owner duty by relying solely on the
    company registers, a restriction on the sources for BO identification and verification (the guideline counts
    sources as part of verification). It is not worded as a definition or a 'treated as' deeming provision, though
    reading it as a rule on how 28(4) is satisfied, and so unlabelled, is a reasonable alternative.
- candidate: K012
  clause_id: uk_mlr_2017_29_additional_cdd_measures_credit_institutions_and_financial_institutions_29_7
  types:
  - cdd_triggers
  - prohibit_anonymous
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'prohibit_anonymous: not open or keep anonymous accounts or accounts in fictitious names. / cdd_triggers:
    (... a revision of the Notice)'
  reason: CDD must be applied to every anonymous account and passbook existing at commencement before it is used
    in any way, so the firm may not keep operating anonymous accounts (the 'keep' half of prohibit_anonymous, which
    29(6) does not cover), and commencement of the Regulations works as a trigger like a revision of the Notice.
    cdd_triggers alone is defensible but drops the prohibition.
- candidate: K013
  clause_id: uk_mlr_2017_29_additional_cdd_measures_credit_institutions_and_financial_institutions_29_7a
  types:
  - cdd_triggers
  - prohibit_anonymous
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'prohibit_anonymous: not open or keep anonymous accounts or accounts in fictitious names. / cdd_triggers:
    (... a revision of the Notice)'
  reason: 'Same as 29(7), for anonymous safe-deposit boxes existing on 10 January 2019: CDD before any use means
    they cannot be kept anonymous, and the date works as a trigger. Safe-deposit boxes are not literally ''accounts'',
