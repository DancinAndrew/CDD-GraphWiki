- candidate: K027
  clause_id: uk_mlr_2017_35_enhanced_cdd_politically_exposed_persons_35_3
  types:
  - pep_edd
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'pep_edd: apply enhanced measures because the customer or a beneficial owner is a PEP, or a family
    member or close associate of one. / A lead-in gets type T when its own text states a requirement of type T,
    or introduces a list whose items have type T.'
  reason: Once the customer is found to be a PEP or connected to one, the firm must assess the extent of the enhanced
    CDD to apply ((b)); deciding the scope of the PEP enhanced measures is part of applying them, so the lead-in
    carries pep_edd through (b). If (b) were read as risk assessment, the lead-in would have no type.
- candidate: K028
  clause_id: uk_mlr_2017_35_enhanced_cdd_politically_exposed_persons_35_3_a
  types: []
