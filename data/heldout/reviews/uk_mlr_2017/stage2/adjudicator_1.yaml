decisions:
- candidate: K001
  clause_id: uk_mlr_2017_27_cdd_27_7b
  types: []
  decided_by_guideline: true
  pre_registered_breaks_guideline: false
  guideline_quote: Saying *how* CDD is done, or *on whom*, is not a trigger.
  reason: 27(7B) only says on whom the 27(7A) CDD is applied (landlord and tenant); the trigger sits in 27(7A),
    and generic 'apply customer due diligence measures' wording states no identification or verification requirement
    of its own, so it is a scope statement, not verify_customer.
- candidate: K002
  clause_id: uk_mlr_2017_27_cdd_27_8_a
  types:
  - cdd_triggers
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'A sub-paragraph is read together with the lead-in of its paragraph. It gets type T when it is
    part of a requirement of type T / cdd_triggers: perform CDD measures when a stated event or circumstance occurs'
  reason: Read with the 27(8) lead-in ('must also apply customer due diligence measures'), (a) is one of the listed
    occasions on which CDD must be applied to existing customers, so it is part of a trigger requirement and distinct
    from the ongoing monitoring in 28(11). 'Appropriate times on a risk based approach' is a vaguer circumstance
    than (za) or (b), which leaves room for the no-type reading.
- candidate: K003
  clause_id: uk_mlr_2017_27_cdd_27_9
  types: []
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'Definitions, scope statements and paragraphs that only say how other paragraphs are read. /
    cdd_triggers: perform CDD measures when a stated event or circumstance occurs'
  reason: 27(9) does not require CDD when an event occurs; it requires the firm to weigh listed factors when judging
    what is 'appropriate' under 27(8)(a), which carries the actual trigger. It has the same 'must take account of
    ... among other things' factor-list form as 28(13), 33(6) and 37(3), so I read it as guidance on applying 27(8);
    the functional reading of its items as triggers is reasonable but not required.
