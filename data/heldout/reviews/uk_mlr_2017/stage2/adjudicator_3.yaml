  types:
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: identify the customer or verify the customer's identity, including the information to obtain, the sources to use and when verification must be completed.
  reason: '''Identify the customer in accordance with regulation 28(2)(a)'', with the timing (before opening). It is a duty, not a ''may ... provided that'' exception condition; (b) concerns a person acting for the customer and is excluded.'
- candidate: K018
