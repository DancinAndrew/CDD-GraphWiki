- candidate: K001
  clause_id: uk_mlr_2017_27_cdd_27_7b
  types: []
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: Saying *how* CDD is done, or *on whom*, is not a trigger.
  reason: 27(7B) only says on whom the (7A) CDD is applied (landlord and tenant); the trigger is in (7A). It names no identification, verification or information to obtain, so neither cdd_triggers nor verify_customer is engaged, though a 'who is the customer' reading of verify_customer is arguable.
- candidate: K002
  clause_id: uk_mlr_2017_27_cdd_27_8_a
  types:
  - cdd_triggers
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: A sub-paragraph is read together with the lead-in of its paragraph. It gets type T when it is part of a requirement of type T
  reason: An item of the 27(8) list of occasions on which CDD must be applied to existing customers (the lead-in carries stated circumstances in (za), (zb), (b)); it is a residual 'appropriate times' limb, which the guideline's 'revision of the Notice' existing-customer trigger supports. It is not itself a monitoring duty, but 'stated event' is only weakly met.
- candidate: K003
  clause_id: uk_mlr_2017_27_cdd_27_9
  types: []
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: Definitions, scope statements and paragraphs that only say how other paragraphs are read.
  reason: 27(9) does not require CDD on any event; it requires the firm to take listed factors into account when judging what times are 'appropriate' under 27(8)(a). That is a judgement input (a factor list of the kind 28(13), 33(6) and 37(3) provide for risk assessment) and a gloss on how (8) is read, not a duty to perform CDD when an event occurs. A trigger reading of the items is arguable.
