- candidate: K016
  clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_2
  types:
  - verify_customer
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: A lead-in gets type T when its own text states a requirement of type T, or introduces a list whose items have type T.
  reason: A freestanding 'must' paragraph that makes the bank identify the customer before the account is opened, so it introduces a verify_customer item. It could instead be read as a condition of the 30ZA(1) permission ('Subject to paragraphs (2) and (3)'), but it is not phrased as a proviso like 30(3) or 30(4) and imposes a duty rather than relaxing one.
- candidate: K017
