guideline_questions:
- question: '27(9): does a ''must take into account'' factor list for deciding when CDD on existing customers is appropriate count as a cdd_triggers requirement (stated circumstances), or as risk assessment / a gloss on 27(8)(a)? The definition does not say whether a factor that informs timing, without requiring CDD, is a trigger.'
- question: 'prohibit_anonymous: does ''not open or keep'' include a transitional duty to apply CDD to existing anonymous accounts and boxes before use (29(7), 29(7A)), and does the type reach anonymous instruments that are not accounts (bearer share certificates in 29(8), anonymous prepaid cards in 38(4A))?'
- question: 'Connected parties: the guideline excludes them from verify_customer but defines no UK equivalent. State that directors, equivalent management body members and senior persons responsible for operations of a body corporate (28(3)(b)(ii)) are connected parties.'
- question: 'Exception conditions: when a permission is made ''subject to'' separate paragraphs that are phrased as ''must'' duties (30ZA(2) and (3)), are those duties conditions of the permission (unlabelled) or obligations in their own right? The guideline gives ''may ... provided that'' examples only.'
- question: 'Lists in a separate paragraph (30A(1A)) and rules on how a duty is met (28(9)): are these definitions / interpretation, or part of the identify_ubo requirement (information to obtain, sources to use)? The identify_ubo definition lists information but not sources.'
- question: 'PEP paragraphs: whether ''assess the extent of enhanced CDD'' (35(3)(b)), ''systems to determine PEP status and manage the enhanced risks'' (35(1)) and ''enhanced ongoing monitoring'' (35(5)(c)) are pep_edd, risk assessment, internal policies or ongoing monitoring; the exclusions and the pep_edd definition overlap on all three.'
- question: 'Generic ''apply the other CDD measures required by regulation 28'' with a deadline (30ZA(3)(a)): should the clause be read through the cross-reference (verify_customer, identify_ubo as ''when verification must be completed'') or only on its own wording (no type or cdd_triggers)?'
