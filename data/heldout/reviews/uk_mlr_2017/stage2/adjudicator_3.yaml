- candidate: K007
  clause_id: uk_mlr_2017_27_cdd_27_9_d
  types: []
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: 'Requirements of other kinds that the system does not model: risk assessment, screening, ongoing monitoring, record keeping, ... simplified CDD, internal policies, and enhanced measures for higher-risk customers who are not politically exposed persons (PEPs).'
  reason: '''Any other matter which might affect the ... assessment of the money laundering or terrorist financing risk'' is a risk-assessment catch-all, not a stated event, and sits in a factor list that only glosses 27(8)(a). If the 27(9) list were read as a trigger list it would carry the type only through the list rule.'
- candidate: K008
  clause_id: uk_mlr_2017_28_cdd_measures_28_3_b_ii
  types: []
  decided_by_guideline: true
  pre_registered_breaks_guideline: true
  guideline_quote: It does not cover persons acting on the customer's behalf, connected parties or life-policy beneficiaries.
  reason: The full names of the board of directors and of the senior persons responsible for operations are the directors and executives of a legal-person customer, i.e. its connected parties, which verify_customer expressly does not cover. The siblings (attributes of the body corporate itself) and the 28(3)(b) lead-in keep verify_customer.
- candidate: K009
  clause_id: uk_mlr_2017_28_cdd_measures_28_8
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: A lead-in gets type T when its own text states a requirement of type T, or introduces a list whose items have type T.
  reason: The lead-in introduces (a) record keeping and (b) verification of the senior managing person who stands in for the beneficial owner when (7) applies; with (b) typed identify_ubo the lead-in carries it. The condition 'If paragraph (7) applies' is a condition of the duty, not an exemption.
- candidate: K010
  clause_id: uk_mlr_2017_28_cdd_measures_28_8_b
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: inquire about, identify or verify the beneficial owners of a customer, including the information to obtain about them and understanding the customer's ownership and control structure.
  reason: 28(8)(b) is a 'must' duty to verify the identity of the senior person who, by 28(6), takes the place of the beneficial owner when no beneficial owner can be identified; this is the last step of beneficial-owner identification. The deeming exclusion applies to 28(6) itself (a 'may treat' provision), not to this separate duty, and verify_customer's connected-party carve-out does not limit identify_ubo. The record-keeping parts add nothing. Reading the person as a non-owner is arguable.
- candidate: K011
  clause_id: uk_mlr_2017_28_cdd_measures_28_9
  types:
  - identify_ubo
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: inquire about, identify or verify the beneficial owners of a customer, including the information to obtain about them and understanding the customer's ownership and control structure.
  reason: '28(9) restricts how the 28(4) beneficial-owner duty is met: sole reliance on registrar information does not satisfy it. That limits the sources for identifying and verifying beneficial owners and so shapes the duty itself; it is arguable, however, that it only says how (4) is read and so falls under the interpretation exclusion.'
- candidate: K012
  clause_id: uk_mlr_2017_29_additional_cdd_measures_credit_institutions_and_financial_institutions_29_7
  types:
  - cdd_triggers
  - prohibit_anonymous
  decided_by_guideline: false
  pre_registered_breaks_guideline: false
  guideline_quote: not open or keep anonymous accounts or accounts in fictitious names.
  reason: 'Requires CDD on all anonymous accounts, passbooks or boxes existing on a stated date and in any event before any use, so existing anonymous accounts cannot be kept or used as anonymous: a CDD trigger (a stated date and first use, like the ''revision of the Notice'' trigger) and the ''keep'' limb of the anonymous-account ban that 29(6) leaves for existing items. The text does not say ''must not keep'', so cdd_triggers alone is also defensible.'
