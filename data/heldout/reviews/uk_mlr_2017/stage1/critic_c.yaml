# ---------------------------------------------------------------- medium confidence

- clause_id: uk_mlr_2017_28_cdd_measures_28_3_b_ii
  pre_registered: [verify_customer]
  proposed: []
  kind: wrong_label
  reason: "28(3)(b)(ii) requires the firm to determine and verify the full names of the board of directors and of the senior persons responsible for the operations of a body-corporate customer. These are the customer's directors and senior managers, i.e. its connected parties in the guideline's (MAS) sense, not the customer. The siblings 28(3)(a)(i)-(iii) (name, registration number, address) and 28(3)(b)(i) (governing law, constitution) are attributes of the customer itself and rightly verify_customer; (b)(ii) is about other natural persons and falls in the verify_customer carve-out. Same logic that correctly leaves 28(10) (persons acting for the customer) unlabelled. The 28(3)(b) lead-in keeps verify_customer through (b)(i)."
  guideline_basis: "It does not cover persons acting on the customer's behalf, connected parties or life-policy beneficiaries."
  confidence: medium

- clause_id: uk_mlr_2017_28_cdd_measures_28_9
  pre_registered: [identify_ubo]
  proposed: []
  kind: wrong_label
  reason: "28(9) imposes no act of its own; it says that the requirements under paragraph (4) are not satisfied by relying solely on information delivered to the companies registrar. That is a rule about how paragraph (4) is read (a negative deeming provision). The guideline treats the positive mirror image ('is to be treated as identifying', 30ZA(4)) as interpretation and the labels leave it unlabelled; the labels also leave 28(18)(a) and 28(19) (what counts as a reliable, independent source for verification) unlabelled. Labelling 28(9) but not those is inconsistent. The identify_ubo definition covers 'the information to obtain about them' and the ownership/control structure; 'the sources to use' appears only in the verify_customer definition. The label note's analogy to MAS 6.9 does not change the form of this paragraph."
  guideline_basis: "Definitions, scope statements and paragraphs that only say how other paragraphs are read. / deeming provisions (\"is to be treated as identifying\") are read as interpretation and not labelled"
  confidence: medium

- clause_id: uk_mlr_2017_29_additional_cdd_measures_credit_institutions_and_financial_institutions_29_7
  pre_registered: [cdd_triggers]
  proposed: [cdd_triggers, prohibit_anonymous]
  kind: missing_label
  reason: "29(6) bars setting up anonymous accounts (labelled prohibit_anonymous). 29(7) deals with anonymous accounts and passbooks that already exist: CDD must be applied to all of them, and in any event before they are used in any way. In effect the firm may not keep operating an anonymous account, which is the 'keep' half of the prohibit_anonymous definition. Labelling only the transitional trigger drops the prohibition, and the paragraph-level view of reg 29 then credits prohibit_anonymous only for new accounts."
  guideline_basis: "prohibit_anonymous | not open or keep anonymous accounts or accounts in fictitious names."
  confidence: medium

