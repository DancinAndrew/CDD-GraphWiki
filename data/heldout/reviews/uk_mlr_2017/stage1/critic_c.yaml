guideline_questions:
- question: "Conditions attached to a permission but worded as 'must'. 30ZA(1) is a permission 'subject to paragraphs (2) and (3)', yet 30ZA(2)-(3) are labelled. The provisos to deferral permissions in 30(3) (complete verification as soon as practicable) and 30(4) (no transactions before verification is complete) are unlabelled, as is the 31(5)(a) exemption condition. Does 'exception conditions attached to a requirement' cover conditions a permission is expressly subject to, regardless of wording? Affects 30ZA(2), 30ZA(2)(a), 30ZA(3), 30ZA(3)(a), 30ZA(3)(b), 30(3), 30(4), 30A(8A)."
- question: "PEP measures keyed to a life-insurance beneficiary. pep_edd requires the customer or a BO to be the PEP, and the UK note says life-policy beneficiaries are not BOs. Yet 35(8) imposes enhanced measures on the policy holder's relationship because the beneficiary is a PEP, and 35(9) (labelled pep_edd) extends 'paragraphs (5) and (8)'. 35(6)-(7) require PEP determination for beneficiaries and their BOs, and 33(4B) requires identifying and verifying the BO of a high-risk legal-person beneficiary. Should any of these count? Affects 35(6)-(8), 33(4B), 29(3)-(5)."
- question: "'Connected parties' is a MAS term with no UK counterpart. Does it cover a body corporate's directors and senior persons (28(3)(b)(ii)) and the senior managing person verified when no BO can be found (28(8)(b), deemed BO under 28(6))? The answer decides whether those clauses are verify_customer, identify_ubo or unlabelled."
- question: "Rules on what does or does not satisfy a verification or BO duty. 28(9) is labelled, but 28(18)(a) ('verify' means from a reliable independent source), 28(19) (electronic ID counts as such a source) and 30ZA(4) (deemed identification) are not. verify_customer explicitly includes 'the sources to use', but definitions and deeming provisions are excluded. The guideline should say whether source rules phrased as definitions or negative deeming are labelled."
- question: "Paragraphs that define a trigger's events or a requirement's scope instead of stating it. 27(6)(a)-(b) and (a)(i)-(iii) define the casino transactions that trigger CDD under 27(5) and are unlabelled as definitions, while the equivalent items in 27(7C)(a)-(b) are labelled because they hang off a 'must' lead-in. Likewise 30A(1)(a)-(e) (entity types, labelled) versus 30(6)(a)-(b) and 28(7)(a)-(b) (conditions, unlabelled). The same content is scored differently because of drafting form."
- question: "Risk-based CDD on existing customers. Is 'at other appropriate times to existing customers on a risk based approach' (27(8)(a)) a 'stated event or circumstance', or periodic review that belongs with ongoing monitoring? If it is a trigger, should the 27(9) factors that define 'appropriate' (identity or BO change, inconsistent transactions, change of purpose) be triggers too? Affects 27(8)(a), 27(9)(a)-(d)."
- question: "Excluded categories that contain in-scope content. Simplified-CDD exits (37(8)(a) doubts, 37(8)(c) suspicion) repeat the trigger events in 27(1)(c)-(d). The e-money carve-back (38(2)) reinstates CDD above a threshold. Enhanced ongoing monitoring sits inside the PEP list (35(5)(c)). PEP-determination systems (35(1)) mix screening, internal policies and managing PEP risk. Should a category exclusion override a type definition the text otherwise meets?"
- question: "Scope of prohibit_anonymous. The labels apply it to anonymous safe-deposit boxes (29(6)), which are not accounts. Does it also cover the duty to bring existing anonymous accounts under CDD before use (29(7), 29(7A)), the ban on bearer share certificates (29(8)(b)) and the restriction on accepting anonymous prepaid cards (38(4A))?"
- question: "'Assess the extent of EDD' versus risk assessment. 35(3)(a) (assess risk level) is excluded as risk assessment, 35(3)(b) (assess extent of PEP EDD) is labelled pep_edd, and 35(4)(a) (how to make that same assessment) is unlabelled. The guideline should say whether calibrating the amount of EDD for a PEP is an enhanced measure or a risk assessment."
- question: "'On whom' CDD is done is excluded from cdd_triggers, but the guideline does not say whether it belongs under verify_customer or nowhere. Affects 27(7B) (CDD on both landlord and tenant) and 35(13), which by interpretation extends 35(5) PEP measures to customers whose BO is a PEP and is the only text making 35(5) reach BO-PEPs."
