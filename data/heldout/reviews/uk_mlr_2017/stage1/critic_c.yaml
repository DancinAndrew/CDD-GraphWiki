# ---------------------------------------------------------------- low confidence: reg 30ZA (insolvent bank customers)

- clause_id: uk_mlr_2017_30za_insolvent_bank_customers_30za_3_a
  pre_registered: [cdd_triggers]
  proposed: [verify_customer, identify_ubo]
  kind: wrong_label
  reason: "The CDD duty for an insolvent bank customer is already triggered by establishing the relationship (27(1)(a)); 30ZA(1) only lets the bank defer completing it. 30ZA(3)(a) sets the deadline for completing the deferred reg 28 measures ('as soon as practicable'), i.e. when verification of the customer (28(2)(b)) and the BO (28(4)) must be completed. The guideline puts timing under verify_customer and says how CDD is done is not a trigger. It also clashes with 30(3), where the same 'completed as soon as practicable' wording is unlabelled. Counter-argument: the trigger list includes 'acquiring another institution's customers', which taking on a failed bank's customers resembles."
  guideline_basis: "verify_customer | ... including the information to obtain, the sources to use and when verification must be completed. / Saying *how* CDD is done, or *on whom*, is not a trigger."
  confidence: low

