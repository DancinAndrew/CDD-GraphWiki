- clause_id: uk_mlr_2017_35_enhanced_cdd_politically_exposed_persons_35_1_b
  pre_registered: []
  proposed: [pep_edd]
  kind: missing_label
  reason: "Read with its lead-in, 35(1)(b) requires the firm to have systems and procedures to determine whether a customer or its beneficial owner is a family member or known close associate of a PEP 'and to manage the enhanced risks arising from the relevant person's business relationship or transactions with such a customer'. The second limb (in this record's text) is a duty to manage enhanced risk because the customer or a BO is a PEP or connected to one. The labels give pep_edd to 35(3)/(3)(b), which only requires assessing the extent of EDD; 35(1)(b) is at least as much an enhanced measure. Counter-argument: 'risk-management systems and procedures' could be read as internal policies, which are excluded."
  guideline_basis: "pep_edd | apply enhanced measures because the customer or a beneficial owner is a PEP, or a family member or close associate of one."
  confidence: medium

