  parent_clause_id: fatf_rec10_interpretive_note_to_rec_10_p_5_b_b
  raw_text: '(i) For legal persons: (i.i) The identity of the natural persons (if any – as ownership interests
    can be so diversified that there are no natural persons (whether acting alone or together) exercising
    control of the legal person or arrangement through ownership) who ultimately have a controlling ownership
    interest in a legal person; and

