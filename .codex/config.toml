#:schema https://developers.openai.com/codex/config-schema.json

# Project-local Codex profile derived from Everything Claude Code.
# This is intentionally conservative: no package-installing MCP servers are
# enabled until the user approves the concrete dependency.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

persistent_instructions = "Follow project AGENTS.md and .codex/AGENTS.md. This is a Python-first, spec-first AML / CDD knowledge-compilation project. Ask before installing packages, enabling MCP servers, or choosing new frameworks."

[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Reviewer focused on correctness, security, behavioral regressions, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

